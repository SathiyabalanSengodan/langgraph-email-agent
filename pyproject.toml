[project]
name = "langgraph-email-agent"
version = "0.1.0"
description = "A customer-support email agent built with LangGraph: classification, parallel context gathering, and human-in-the-loop approval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-openai>=1.1.14",
    "python-dotenv>=1.0.0",
]

[project.scripts]
email-agent = "email_agent.cli:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.0",
    "pytest>=8.0.0",
    "ruff>=0.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
